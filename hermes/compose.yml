# Hermes AI Agent — the third-party nousresearch/hermes-agent image, fronted by
# Traefik at hermes.ham51.com.
#
# Included from the root `compose.yaml`; run everything from the project root.
# Dashboard credentials live in `hermes/.env` (gitignored, see .env.example).
# Non-secret configuration that should be version-controlled lives here.
#
# All agent state is the `hermes-data/` bind mount beside this file. It is the
# only copy — no named volume, no backup mechanism. `down -v` does not touch it
# (it is a bind mount, not a volume), but `rm -rf hermes/hermes-data` is
# unrecoverable.
services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped

    # The messaging gateway (Slack/Telegram/cron) is the container's main
    # program. It stays up even with nothing configured — it warns "No
    # messaging platforms enabled" and keeps running — so this is safe on a
    # fresh hermes-data/. The dashboard is NOT this command; see below.
    command: ["gateway", "run"]

    environment:
      # Every value here comes from hermes/enc.env, decrypted into the environment
      # by ./runit.sh. There is no hermes/.env any more, so this block is the
      # complete list of what the container receives.
      #
      # Dashboard login. Required in practice: the dashboard binds 0.0.0.0 so
      # Traefik can reach it, which engages the auth gate, and start_server fails
      # closed without a provider. `:?` makes that a parse-time error instead of a
      # container that runs while hermes.ham51.com never answers.
      #
      # The scrypt hash is single-quoted in enc.env because it is full of '$'.
      # Interpolating it here is safe — Compose does not re-interpolate the
      # result — but unquoting it in enc.env would let the dotenv parser expand
      # those segments and silently mangle the hash.
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?set it in hermes/enc.env, and start with ./runit.sh}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH:?set it in hermes/enc.env — the scrypt hash, not the password}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?set it in hermes/enc.env, or every restart logs you out}

      # Inference. The agent's own model is hermes-data/config.yaml, not these —
      # these are read by individual plugins. The custom-provider key is the one
      # config.yaml names in `key_env:`. All optional; empty reads as absent.
      # A bare name is pass-through: set from the environment if present,
      # OMITTED entirely if not. `${VAR:-}` would instead set it to the empty
      # string, which is a different thing to a plugin testing whether the
      # variable exists — so use the bare form wherever the name is unchanged.
      OPENAI_BASE_URL:
      HERMES_CUSTOM_LLM_CODER_MID_HAM51_COM_API_KEY:
      # Private search over AI-LAB, if the agent is pointed at it.
      SEARXNG_URL:
      # These two are renamed, which pass-through cannot do, so they take the
      # empty string when unset. Both are set in enc.env.
      OPENAI_API_KEY: ${HERMES_OPENAI_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${HERMES_BRAVE_SEARCH_API_KEY:-}

      # Messaging gateway. Absent is fine — it warns "No messaging platforms
      # enabled" and keeps running.
      SLACK_BOT_TOKEN:
      SLACK_APP_TOKEN:
      SLACK_ALLOWED_USERS:
      SLACK_HOME_CHANNEL:

      # The web dashboard is a separate s6-supervised service inside the image,
      # not the main command above. Without HERMES_DASHBOARD its run script
      # exits immediately and the slot reports permanently down — no error, no
      # dashboard.
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_PORT: "9119"

      # HERMES_DASHBOARD_HOST defaults to 0.0.0.0, which is what lets Traefik
      # reach it across AI-LAB. That is a non-loopback bind, so the auth gate
      # engages and start_server FAILS CLOSED unless an auth provider is
      # registered — HERMES_DASHBOARD_INSECURE has been a no-op since the June
      # 2026 hardening. The credentials in .env are what satisfy it; without
      # them the container runs but the dashboard never binds.
      #
      # Traefik terminates TLS and forwards X-Forwarded-Proto, which is what
      # makes the session cookie Secure. PUBLIC_URL is the declared authority
      # for URL reconstruction; it matters most if this is ever switched from
      # the password provider to Nous Portal OAuth.
      HERMES_DASHBOARD_PUBLIC_URL: "https://hermes.ham51.com"

    volumes:
      - ./hermes-data:/opt/data

    # No published ports — same as every other service here. Traefik reaches
    # 9119 over AI-LAB and is the only way in. Publishing would put a container
    # with local shell execution (terminal.backend: local) on the LAN,
    # bypassing TLS.
    networks:
      - ai-lab

networks:
  ai-lab:
    name: AI-LAB
