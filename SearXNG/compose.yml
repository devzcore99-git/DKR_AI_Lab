
services:

  searxng:
  #  container_name: searxng-core
    image: docker.io/searxng/searxng:latest
    restart: always
    environment:
      # From SearXNG/enc.env via ./runit.sh — no .env file is involved any more.
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:?set SEARXNG_BASE_URL in SearXNG/enc.env, and start with ./runit.sh}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in SearXNG/enc.env, and start with ./runit.sh}
      # The image ships `valkey: url: false` in its default settings.yml, so the
      # cache is off unless something turns it on. Set here rather than in
      # core-config/settings.yml because that file is gitignored — this is plumbing,
      # not a secret. Set here rather than in enc.env because this is plumbing
      # that should be version-controlled, not a per-host value.
      SEARXNG_VALKEY_URL: valkey://searxng-valkey:6379/0
    # No published port: Traefik fronts this at https://search.ham51.com and is
    # the only way in. Open WebUI reaches it in-network at http://searxng:8080.
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - searxng-core-data:/var/cache/searxng/
    networks:
    - ai-lab

  searxng-valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - searxng-valkey-data:/data/
    # Without this the container lands on the project default bridge, where
    # searxng cannot resolve it. No ports are published — the cache is reachable
    # only from AI-LAB, which is the intent.
    networks:
      - ai-lab


volumes:
  searxng-core-data:
  searxng-valkey-data:


networks:
  ai-lab:
    name: AI-LAB