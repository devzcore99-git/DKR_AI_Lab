# Open WebUI — the chat front end for the lab.
#
# Included from the root `compose.yaml`; run everything from the project root.
# Secrets and the model backend URL live in `open-webui/.env` (gitignored, see
# .env.example). Non-secret configuration that should be version-controlled —
# the MCP tool servers below — lives here instead.
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    #ports:
    #  - "3000:8080"
    environment:
      # Every value here comes from open-webui/enc.env, decrypted into the
      # environment by ./runit.sh. There is no open-webui/.env any more, so this
      # block is the complete list of what the container receives — add a
      # variable to enc.env and it goes nowhere until it is named here too.
      #
      # The two API keys are namespaced on the host side because hermes/enc.env
      # holds names that would otherwise collide in the one flat environment, and
      # are mapped back here to the plain names the application reads.
      #
      # Required — no default, so a missing key fails the whole project at parse
      # time rather than starting a chat front end that cannot reach a model.
      OPENAI_API_KEY: ${OPENWEBUI_OPENAI_API_KEY:?set OPENWEBUI_OPENAI_API_KEY in open-webui/enc.env, and start with ./runit.sh}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:?set OPENAI_API_BASE_URL in open-webui/enc.env}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in open-webui/enc.env}
      WEBUI_AUTH: ${WEBUI_AUTH:-False}

      # Web search. Optional: leave BRAVE_SEARCH_API_KEY empty and pick the
      # SearXNG engine instead — empty reads as absent to Open WebUI.
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-False}
      WEB_SEARCH_ENGINE:
      WEB_SEARCH_RESULT_COUNT: ${WEB_SEARCH_RESULT_COUNT:-5}
      BRAVE_SEARCH_API_KEY: ${OPENWEBUI_BRAVE_SEARCH_API_KEY:-}

      # MCPJungle tool groups, pre-registered as MCP tool servers so a fresh
      # volume comes up with them already wired instead of needing Admin
      # Settings -> External Tools clicked through by hand.
      #
      # Open WebUI 0.11 parses TOOL_SERVER_CONNECTIONS as JSON (a list) and
      # seeds the `tool_server.connections` config key from it. Requirements
      # worth knowing before editing:
      #   - "type": "mcp" selects the native streamable-HTTP MCP client. The
      #     default, "openapi", would try to fetch an OpenAPI spec and fail.
      #   - "config": {"enable": true} is what makes a server visible; an entry
      #     without it is stored and ignored.
      #   - "info": {"id"} is the stable handle (the tool id becomes
      #     server:mcp:<id>) and "info": {"name"} is the label in the UI.
      #   - "auth_type": "none" — MCPJungle runs in development mode with no
      #     token. Switch to "bearer" plus "key" if that ever changes.
      #   - Each URL is a *group* endpoint, so a chat sees that group's handful
      #     of tools rather than all fourteen. http://mcpjungle:8080/mcp serves
      #     the whole registry if an everything-server is ever wanted.
      #
      # THIS SEEDS, IT DOES NOT OVERRIDE. Open WebUI reads the env var only
      # while the `tool_server.connections` row is absent from its database.
      # The first save in Admin Settings -> External Tools writes that row, and
      # from then on the UI is the source of truth and edits here do nothing.
      # To go back to this file being authoritative, delete the row:
      #   docker compose exec open-webui \
      #     python -c "import sqlite3;sqlite3.connect('/app/backend/data/webui.db').execute(\"delete from config where key='tool_server.connections'\").connection.commit()"
      # then restart the container. Setting ENABLE_PERSISTENT_CONFIG=False in
      # .env makes the env var win permanently — but it does that for *every*
      # setting, freezing all of Admin Settings, so it is not the default here.
      TOOL_SERVER_CONNECTIONS: |
        [
          {
            "type": "mcp",
            "url": "http://mcpjungle:8080/v0/groups/ChatLLM/mcp",
            "path": "",
            "auth_type": "none",
            "key": "",
            "info": {
              "id": "mcpjungle-chatllm",
              "name": "MCPJungle: ChatLLM",
              "description": "Web search (Brave) and URL fetch, for general chat."
            },
            "config": { "enable": true }
          },
          {
            "type": "mcp",
            "url": "http://mcpjungle:8080/v0/groups/Coding/mcp",
            "path": "",
            "auth_type": "none",
            "key": "",
            "info": {
              "id": "mcpjungle-coding",
              "name": "MCPJungle: Coding",
              "description": "Web search, URL fetch and Context7 library documentation."
            },
            "config": { "enable": true }
          },
          {
            "type": "mcp",
            "url": "http://mcpjungle:8080/v0/groups/MicrosoftExpert/mcp",
            "path": "",
            "auth_type": "none",
            "key": "",
            "info": {
              "id": "mcpjungle-microsoftexpert",
              "name": "MCPJungle: MicrosoftExpert",
              "description": "Web search, URL fetch and Microsoft Learn documentation search."
            },
            "config": { "enable": true }
          },
          {
            "type": "mcp",
            "url": "http://mcpjungle:8080/v0/groups/WebAutomation/mcp",
            "path": "",
            "auth_type": "none",
            "key": "",
            "info": {
              "id": "mcpjungle-webautomation",
              "name": "MCPJungle: WebAutomation",
              "description": "Web search, URL fetch and a real headless Chromium (Playwright) for browsing and interacting with pages."
            },
            "config": { "enable": true }
          }
        ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui2:/app/backend/data
    networks:
      - ai-lab

volumes:
  open-webui2:

networks:
  ai-lab:
    name: AI-LAB
