services:
  traefik:
    image: traefik:v3.7.8
    container_name: traefik-frontend2
    restart: unless-stopped

    command:
      # Enable file provider
      - "--providers.file.filename=/etc/traefik/proxies.yml"

      # Entry points. TLS on 443 is the only one — every router in proxies.yml
      # binds `port443` with `certResolver: letsencrypt`, so a plaintext
      # entrypoint would be a way around TLS rather than a route to anything.
      # The former lmstudio/mcpgateway/searxng entrypoints on 10001-10003 were
      # referenced by no router at all and served nothing but 404s.
      - "--entrypoints.port443.address=:443"

      # ACME
      - "--certificatesresolvers.letsencrypt.acme.email=admin@ham51.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.delaybeforecheck=60"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    
    env_file:
      - .env

    #environment:
    #  - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "443:443"

    volumes:
      - "./proxies.yml:/etc/traefik/proxies.yml:ro"
      - "./letsencrypt:/letsencrypt"

    networks:
      - ai-lab

networks:
  ai-lab:
    name: AI-LAB